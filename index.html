<!DOCTYPE PUBLIC "-//W3C//DTD HTML 4.01 Strict//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Ung dung Ket Ban HTML4</title>
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 20px;
    }
    .box {
      width: 450px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #cccccc;
      padding: 15px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      color: #333333;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }
    .section {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #eeeeee;
    }
    label {
      font-weight: bold;
      font-size: 13px;
    }
    input[type="text"] {
      padding: 5px;
      width: 200px;
      border: 1px solid #999999;
    }
    input[type="button"], button {
      padding: 5px 10px;
      background-color: #0066cc;
      color: #ffffff;
      border: 1px solid #004488;
      cursor: pointer;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border: 1px solid #999999;
      vertical-align: middle;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table, th, td {
      border: 1px solid #dddddd;
    }
    th, td {
      padding: 6px;
      text-align: left;
      font-size: 13px;
    }
    .status-msg {
      color: red;
      font-size: 12px;
      margin-top: 5px;
    }
  </style>

  <script type="text/javascript">
    // Danh sach nguoi dung he thong (ID + Ten + Avatar)
    var databaseUsers = [
      { id: "USER01", name: "Nam N", avatar: "https://i.imgur.com/6VBx3io.png" },
      { id: "USER02", name: "Huynh Nhi", avatar: "https://i.imgur.com/6VBx3io.png" },
      { id: "1001", name: "Admin", avatar: "https://i.imgur.com/6VBx3io.png" }
    ];

    // Danh sach ban be hien tai
    var myFriends = [];

    // Chuan hoa chuoi: Xoa khoang trang va chuyen ve chu thuong
    function cleanString(str) {
      if (!str) return "";
      // Strip space dau va cuoi (thay the trim() HTML4)
      var cleaned = str.replace(/^\s+|\s+$/g, '');
      return cleaned.toLowerCase();
    }

    // 1. Tim kiem bang ID (Khong lo loi nhap thua khoang trang hay hoa/thuong)
    function searchUserByID() {
      var inputVal = document.getElementById("searchIDInput").value;
      var cleanInput = cleanString(inputVal);
      var msgBox = document.getElementById("searchMsg");
      var resultArea = document.getElementById("searchResultArea");

      msgBox.innerHTML = "";
      resultArea.style.display = "none";

      if (cleanInput === "") {
        msgBox.innerHTML = "Vui long nhap ID can tim!";
        return;
      }

      var foundUser = null;
      for (var i = 0; i < databaseUsers.length; i++) {
        var currentID = cleanString(databaseUsers[i].id);
        if (currentID === cleanInput) {
          foundUser = databaseUsers[i];
          break;
        }
      }

      if (foundUser) {
        document.getElementById("resAvatar").src = foundUser.avatar;
        document.getElementById("resName").innerHTML = foundUser.name;
        document.getElementById("resID").innerHTML = foundUser.id;
        document.getElementById("targetUserID").value = foundUser.id;
        resultArea.style.display = "block";
      } else {
        msgBox.innerHTML = "Khong tim me gi thay ID '" + inputVal + "'. Ket qua test ID co san: USER01, USER02, 1001";
      }
    }

    // 2. Them vao danh sach ban be
    function addFriend() {
      var targetID = document.getElementById("targetUserID").value;
      
      // Kiem tra xem da la ban nghe chua
      for (var i = 0; i < myFriends.length; i++) {
        if (cleanString(myFriends[i].id) === cleanString(targetID)) {
          alert("Nguoi nay da co trong danh sach ban be roi!");
          return;
        }
      }

      // Lay thong tin user va push vao list ban be
      for (var j = 0; j < databaseUsers.length; j++) {
        if (cleanString(databaseUsers[j].id) === cleanString(targetID)) {
          myFriends.push(databaseUsers[j]);
          break;
        }
      }

      alert("Da ket ban thanh cong!");
      document.getElementById("searchResultArea").style.display = "none";
      document.getElementById("searchIDInput").value = "";
      renderFriendList();
    }

    // 3. Hien thi danh sach ban be ra bang
    function renderFriendList() {
      var tbody = document.getElementById("friendTableBody");
      tbody.innerHTML = "";

      if (myFriends.length === 0) {
        tbody.innerHTML = "<tr><td colspan='3'>Chua co ban be nao.</td></tr>";
        return;
      }

      for (var i = 0; i < myFriends.length; i++) {
        var user = myFriends[i];
        var tr = document.createElement("tr");
        
        tr.innerHTML = "<td><img src='" + user.avatar + "' class='avatar' alt='Avatar'></td>" +
                       "<td><b>" + user.name + "</b><br><small>ID: " + user.id + "</small></td>" +
                       "<td><input type='button' value='Goi Dien' onclick=\"makeCall('" + user.name + "')\"></td>";
        tbody.appendChild(tr);
      }
    }

    // 4. Cap nhat Avatar ca nhan
    function updateAvatar() {
      var newUrl = document.getElementById("avatarUrlInput").value;
      if (cleanString(newUrl) === "") {
        alert("Vui long nhap Link anh!");
        return;
      }
      document.getElementById("myAvatarImg").src = newUrl;
      alert("Da cap nhat Avatar thanh cong!");
    }

    // 5. Mo phong Cuoc goi
    function makeCall(name) {
      alert("Dang ket noi cuoc goi toi: " + name + "...");
    }
  </script>
</head>
<body>

  <div class="box">
    <div class="title">Ung Dung Ket Ban &amp; Goi Dien (HTML4)</div>

    <!-- KHU VUC HO SO CA NHAN -->
    <div class="section">
      <b>Ho so ca nhan</b><br><br>
      <img id="myAvatarImg" src="https://i.imgur.com/6VBx3io.png" class="avatar" alt="My Avatar">
      <br><br>
      <label for="avatarUrlInput">Doi Avatar (Nhap URL):</label><br>
      <input type="text" id="avatarUrlInput" value="https://i.imgur.com/6VBx3io.png">
      <input type="button" value="Luu Avatar" onclick="updateAvatar()">
    </div>

    <!-- KHU VUC TIM KIEM KET BAN -->
    <div class="section">
      <b>Tim ban qua ID</b><br><br>
      <label for="searchIDInput">Nhap ID nguoi dung:</label><br>
      <input type="text" id="searchIDInput">
      <input type="button" value="Tim Kiem" onclick="searchUserByID()">
      <div id="searchMsg" class="status-msg"></div>

      <!-- KET QUA TIM KIEM -->
      <div id="searchResultArea" style="display:none; margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
        <input type="hidden" id="targetUserID" value="">
        <img id="resAvatar" src="" class="avatar" alt="Result Avatar">
        <span id="resName" style="font-weight:bold;"></span> (ID: <span id="resID"></span>)
        <br><br>
        <input type="button" value="+ Ket Ban ngay" onclick="addFriend()">
      </div>
    </div>

    <!-- DANH SACH BAN BE -->
    <div class="section">
      <b>Danh sach ban be</b>
      <table>
        <thead>
          <tr>
            <th width="60">Anh</th>
            <th>Thong tin</th>
            <th width="80">Hao tac</th>
          </tr>
        </thead>
        <tbody id="friendTableBody">
          <tr>
            <td colspan="3">Chua co ban be nao.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
