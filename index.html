
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIKE Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f0f4fa;color:#172033}
header{background:#246bfd;color:white;padding:20px;font-size:26px;font-weight:bold}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:16px;margin-bottom:15px;box-shadow:0 5px 20px #0001}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd4e0;border-radius:9px}
button{padding:12px 16px;background:#246bfd;color:white;border:0;border-radius:9px;cursor:pointer;margin:4px}
.secondary{background:#e6edff;color:#2457bf}
.hidden{display:none}
.user{padding:12px;background:#f0f4fa;border-radius:8px;margin:7px 0;cursor:pointer}
#messages{height:250px;overflow:auto;background:#f7f9fc;padding:12px;border-radius:10px}
.msg{padding:10px;margin:7px;background:#e2eaff;border-radius:10px;overflow-wrap:anywhere}
.mine{background:#246bfd;color:white;text-align:right}
small{color:#667085}
</style>
</head>
<body>
<header>💬 LIKE Chat</header>
<main>
<section id="login" class="card">
<h2 id="title">Đăng nhập</h2>
<form id="authForm">
<input id="username" placeholder="Tên tài khoản" minlength="3" required>
<input id="password" type="password" placeholder="Mật khẩu" minlength="6" required>
<button id="submit">Đăng nhập</button>
</form>
<button class="secondary" onclick="toggleMode()">Đổi đăng nhập / đăng ký</button>
<p id="authMessage"></p>
<small>Bản demo lưu trên trình duyệt hiện tại.</small>
</section>

<section id="app" class="hidden">
<div class="card">
<b id="welcome"></b>
<button onclick="logout()">Đăng xuất</button>
</div>

<div class="card">
<h3>👥 Kết bạn</h3>
<input id="findName" placeholder="Nhập tên tài khoản bạn muốn tìm">
<button onclick="addFriend()">Thêm bạn</button>
<div id="friends"></div>
</div>

<div class="card">
<h3 id="chatTitle">💬 Tin nhắn</h3>
<div id="messages"></div>
<form id="sendForm">
<input id="message" placeholder="Nhập tin nhắn">
<button>Gửi</button>
</form>
</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let registering=false, me=null, friend=null;

function getData(){
  try{return JSON.parse(localStorage.getItem("likeChatData"))||{users:{}}}
  catch{return {users:{}}}
}
function saveData(data){
  localStorage.setItem("likeChatData",JSON.stringify(data));
}
function toggleMode(){
  registering=!registering;
  $("title").textContent=registering?"Đăng ký":"Đăng nhập";
  $("submit").textContent=registering?"Tạo tài khoản":"Đăng nhập";
  $("authMessage").textContent="";
}
$("authForm").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("username").value.trim();
  const password=$("password").value;
  const data=getData();
  if(registering){
    if(name.length<3||password.length<6){
      $("authMessage").textContent="Tên cần ít nhất 3 ký tự, mật khẩu ít nhất 6 ký tự.";
      return;
    }
    if(data.users[name]){
      $("authMessage").textContent="Tên tài khoản đã tồn tại.";
      return;
    }
    data.users[name]={password:password,friends:[],messages:{}};
    saveData(data);
  }else{
    if(!data.users[name]||data.users[name].password!==password){
      $("authMessage").textContent="Tên tài khoản hoặc mật khẩu sai.";
      return;
    }
  }
  me=name;
  sessionStorage.setItem("likeChatCurrentUser",me);
  showApp();
});
function showApp(){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("welcome").textContent="Xin chào, "+me;
  renderFriends();
}
function logout(){
  sessionStorage.removeItem("likeChatCurrentUser");
  me=null;friend=null;
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}
function addFriend(){
  const name=$("findName").value.trim();
  const data=getData();
  if(!name||name===me||!data.users[name]){
    alert("Không tìm thấy tài khoản khác.");
    return;
  }
  if(!data.users[me].friends.includes(name)){
    data.users[me].friends.push(name);
    data.users[name].friends.push(me);
    data.users[me].messages[name]=data.users[me].messages[name]||[];
    data.users[name].messages[me]=data.users[name].messages[me]||[];
    saveData(data);
  }
  renderFriends();
}
function renderFriends(){
  const box=$("friends");box.replaceChildren();
  const data=getData();
  (data.users[me]?.friends||[]).forEach(name=>{
    const el=document.createElement("div");
    el.className="user";
    el.textContent="👤 "+name;
    el.onclick=()=>openChat(name);
    box.appendChild(el);
  });
}
function openChat(name){
  friend=name;
  $("chatTitle").textContent="💬 Chat với "+name;
  renderMessages();
}
function renderMessages(){
  const box=$("messages");box.replaceChildren();
  if(!friend)return;
  const data=getData();
  const msgs=data.users[me].messages[friend]||[];
  msgs.forEach(m=>{
    const el=document.createElement("div");
    el.className="msg"+(m.from===me?" mine":"");
    el.textContent=m.from+": "+m.text;
    box.appendChild(el);
  });
  box.scrollTop=box.scrollHeight;
}
$("sendForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(!friend){alert("Hãy chọn một người bạn trước.");return}
  const text=$("message").value.trim();
  if(!text)return;
  const data=getData();
  const msg={from:me,text:text};
  data.users[me].messages[friend].push(msg);
  data.users[friend].messages[me].push(msg);
  saveData(data);
  $("message").value="";
  renderMessages();
});
const previous=sessionStorage.getItem("likeChatCurrentUser");
if(previous&&getData().users[previous]){
  me=previous;showApp();
}
</script>
</body>
</html>
