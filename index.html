<!DOCTYPE PUBLIC "-//W3C//DTD HTML 4.01 Strict//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Ung dung Ket Ban &amp; Goi Dien (HTML4)</title>
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 20px;
    }
    .box {
      width: 480px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #cccccc;
      padding: 15px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      color: #333333;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }
    .section {
      margin-bottom: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #eeeeee;
    }
    label {
      font-weight: bold;
      font-size: 13px;
    }
    input[type="text"] {
      padding: 5px;
      width: 190px;
      border: 1px solid #999999;
    }
    input[type="button"], button {
      padding: 5px 10px;
      background-color: #0066cc;
      color: #ffffff;
      border: 1px solid #004488;
      cursor: pointer;
    }
    .avatar {
      width: 50px;
      height: 50px;
      border: 1px solid #999999;
      vertical-align: middle;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table, th, td {
      border: 1px solid #dddddd;
    }
    th, td {
      padding: 6px;
      text-align: left;
      font-size: 13px;
    }
    .status-msg {
      color: red;
      font-size: 12px;
      margin-top: 5px;
    }
    .success-msg {
      color: green;
      font-size: 12px;
      margin-top: 5px;
    }
  </style>

  <script type="text/javascript">
    var databaseUsers = [
      { id: "USER01", name: "Nam N", avatar: "https://i.imgur.com/6VBx3io.png" },
      { id: "USER02", name: "Huynh Nhi", avatar: "https://i.imgur.com/6VBx3io.png" },
      { id: "1001", name: "Admin", avatar: "https://i.imgur.com/6VBx3io.png" }
    ];

    var myFriends = [];

    function cleanString(str) {
      if (!str) return "";
      return str.replace(/^\s+|\s+$/g, '').toLowerCase();
    }

    // Them nguoi dung moi vao danh sach ao de test
    function registerNewUser() {
      var newId = document.getElementById("newUserId").value;
      var newName = document.getElementById("newUserName").value;
      var msgBox = document.getElementById("registerMsg");

      if (cleanString(newId) === "" || cleanString(newName) === "") {
        msgBox.className = "status-msg";
        msgBox.innerHTML = "Vui long nhap du ID va Ten!";
        return;
      }

      // Kiem tra trung ID
      for (var i = 0; i < databaseUsers.length; i++) {
        if (cleanString(databaseUsers[i].id) === cleanString(newId)) {
          msgBox.className = "status-msg";
          msgBox.innerHTML = "ID nay da ton tai trong he thong!";
          return;
        }
      }

      databaseUsers.push({
        id: newId.replace(/^\s+|\s+$/g, ''), // Giu nguyen hoa thuong cua ID nguoi dung nhap
        name: newName,
        avatar: "https://i.imgur.com/6VBx3io.png"
      });

      msgBox.className = "success-msg";
      msgBox.innerHTML = "Them thanh cong ID: " + newId + "! Hay dung ID nay de tim kiem.";
      document.getElementById("newUserId").value = "";
      document.getElementById("newUserName").value = "";
    }

    function searchUserByID() {
      var inputVal = document.getElementById("searchIDInput").value;
      var cleanInput = cleanString(inputVal);
      var msgBox = document.getElementById("searchMsg");
      var resultArea = document.getElementById("searchResultArea");

      msgBox.innerHTML = "";
      resultArea.style.display = "none";

      if (cleanInput === "") {
        msgBox.innerHTML = "Vui long nhap ID can tim!";
        return;
      }

      var foundUser = null;
      for (var i = 0; i < databaseUsers.length; i++) {
        if (cleanString(databaseUsers[i].id) === cleanInput) {
          foundUser = databaseUsers[i];
          break;
        }
      }

      if (foundUser) {
        document.getElementById("resAvatar").src = foundUser.avatar;
        document.getElementById("resName").innerHTML = foundUser.name;
        document.getElementById("resID").innerHTML = foundUser.id;
        document.getElementById("targetUserID").value = foundUser.id;
        resultArea.style.display = "block";
      } else {
        msgBox.innerHTML = "Khong tim thay ID '" + inputVal + "'.";
      }
    }

    function addFriend() {
      var targetID = document.getElementById("targetUserID").value;
      
      for (var i = 0; i < myFriends.length; i++) {
        if (cleanString(myFriends[i].id) === cleanString(targetID)) {
          alert("Nguoi nay da co trong danh sach ban be roi!");
          return;
        }
      }

      for (var j = 0; j < databaseUsers.length; j++) {
        if (cleanString(databaseUsers[j].id) === cleanString(targetID)) {
          myFriends.push(databaseUsers[j]);
          break;
        }
      }

      alert("Ket ban thanh cong!");
      document.getElementById("searchResultArea").style.display = "none";
      document.getElementById("searchIDInput").value = "";
      renderFriendList();
    }

    function renderFriendList() {
      var tbody = document.getElementById("friendTableBody");
      tbody.innerHTML = "";

      if (myFriends.length === 0) {
        tbody.innerHTML = "<tr><td colspan='3'>Chua co ban be nao.</td></tr>";
        return;
      }

      for (var i = 0; i < myFriends.length; i++) {
        var user = myFriends[i];
        var tr = document.createElement("tr");
        tr.innerHTML = "<td><img src='" + user.avatar + "' class='avatar' alt='Avatar'></td>" +
                       "<td><b>" + user.name + "</b><br><small>ID: " + user.id + "</small></td>" +
                       "<td><input type='button' value='Goi' onclick=\"makeCall('" + user.name + "')\"></td>";
        tbody.appendChild(tr);
      }
    }

    function updateAvatar() {
      var newUrl = document.getElementById("avatarUrlInput").value;
      if (cleanString(newUrl) === "") {
        alert("Vui long nhap Link anh!");
        return;
      }
      document.getElementById("myAvatarImg").src = newUrl;
      alert("Cap nhat Avatar thanh cong!");
    }

    function makeCall(name) {
      alert("Dang ket noi cuoc goi toi: " + name + "...");
    }
  </script>
</head>
<body>

  <div class="box">
    <div class="title">Ung Dung Ket Ban &amp; Goi Dien (HTML4)</div>

    <!-- HO SO CA NHAN -->
    <div class="section">
      <b>Ho so ca nhan</b><br><br>
      <img id="myAvatarImg" src="https://i.imgur.com/6VBx3io.png" class="avatar" alt="My Avatar">
      <br><br>
      <label for="avatarUrlInput">Doi Avatar (Nhap URL):</label><br>
      <input type="text" id="avatarUrlInput" value="https://i.imgur.com/6VBx3io.png">
      <input type="button" value="Luu" onclick="updateAvatar()">
    </div>

    <!-- TAO USER TEST (GIUP KHONG BI LOI KHONG TIM THAY ID) -->
    <div class="section" style="background-color: #fffbe6; border-color: #ffe58f;">
      <b>Tao User de test</b><br><br>
      <label>ID:</label> <input type="text" id="newUserId" placeholder="VD: abc123"><br><br>
      <label>Ten:</label> <input type="text" id="newUserName" placeholder="VD: Nguyen Van A"><br><br>
      <input type="button" value="Tao User Moi" onclick="registerNewUser()">
      <div id="registerMsg"></div>
    </div>

    <!-- TIM KIEM KET BAN -->
    <div class="section">
      <b>Tim ban qua ID</b><br><br>
      <label for="searchIDInput">Nhap ID:</label><br>
      <input type="text" id="searchIDInput" placeholder="Thu ID: USER01 hoac ID vua tao">
      <input type="button" value="Tim" onclick="searchUserByID()">
      <div id="searchMsg" class="status-msg"></div>

      <div id="searchResultArea" style="display:none; margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
        <input type="hidden" id="targetUserID" value="">
        <img id="resAvatar" src="" class="avatar" alt="Avatar">
        <span id="resName" style="font-weight:bold;"></span> (ID: <span id="resID"></span>)
        <br><br>
        <input type="button" value="+ Ket Ban" onclick="addFriend()">
      </div>
    </div>

    <!-- DANH SACH BAN BE -->
    <div class="section">
      <b>Danh sach ban be</b>
      <table>
        <thead>
          <tr>
            <th width="50">Anh</th>
            <th>Thong tin</th>
            <th width="60">Tac vu</th>
          </tr>
        </thead>
        <tbody id="friendTableBody">
          <tr>
            <td colspan="3">Chua co ban be nao.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
