
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIKE Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f4fa;font-family:Arial;color:#172033}
header{background:#246bfd;color:white;padding:18px;font-size:25px;font-weight:bold}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:16px;
box-shadow:0 4px 20px #0001;margin-bottom:15px}
input{width:100%;padding:13px;margin:7px 0;
border:1px solid #ccd4e0;border-radius:9px}
button{padding:12px 16px;border:0;border-radius:9px;
background:#246bfd;color:white;cursor:pointer;margin:4px}
button:hover{opacity:.85}
.hidden{display:none}
#messages{height:280px;overflow:auto;background:#f6f8fc;
padding:12px;border-radius:10px}
.msg{padding:10px;margin:8px;background:#e2eaff;
border-radius:10px;overflow-wrap:anywhere}
.mine{background:#246bfd;color:white;text-align:right}
.user{padding:10px;background:#f2f5fa;margin:6px 0;
border-radius:8px;cursor:pointer}
.small{color:#667085;font-size:13px}
</style>
</head>
<body>
<header>💬 LIKE Chat</header>
<main>
<section id="login" class="card">
<h2 id="heading">Đăng nhập</h2>
<form id="authForm">
<input id="username" placeholder="Tên tài khoản (3–20 ký tự)"
minlength="3" maxlength="20" required>
<input id="password" type="password"
placeholder="Mật khẩu (ít nhất 8 ký tự)"
minlength="8" required>
<button id="submitBtn">Đăng nhập</button>
</form>
<button onclick="switchMode()">Đổi đăng nhập / đăng ký</button>
<p class="small">Tài khoản được lưu trên máy chủ.</p>
<p id="authStatus"></p>
</section>

<section id="app" class="hidden">
<div class="card">
<h3 id="welcome"></h3>
<button onclick="logout()">Đăng xuất</button>
</div>

<div class="card">
<h3>🔎 Tìm bạn</h3>
<input id="searchName" placeholder="Nhập chính xác tên tài khoản">
<button onclick="searchUser()">Tìm kiếm</button>
<div id="searchResult"></div>
<div id="incoming"></div>
</div>

<div class="card">
<h3>👥 Danh sách bạn bè</h3>
<div id="friends"></div>
<button onclick="loadFriends()">Làm mới</button>
</div>

<div class="card">
<h3 id="chatTitle">💬 Chọn một người bạn</h3>
<div id="messages"></div>
<form id="sendForm">
<input id="message" placeholder="Nhập tin nhắn..." maxlength="2000">
<button>Gửi tin nhắn</button>
</form>
<p class="small">Tin nhắn được lưu trong cơ sở dữ liệu.</p>
</div>

<div class="card">
<h3>📞 Gọi điện</h3>
<p>Giao diện gọi điện sẽ được kết nối với hệ thống WebRTC.</p>
<button onclick="alert('Cần hoàn thiện máy chủ gọi video để sử dụng tính năng này.')">Gọi thoại</button>
<button onclick="alert('Cần hoàn thiện máy chủ gọi video để sử dụng tính năng này.')">Gọi video</button>
</div>
<p id="status"></p>
</section>
</main>

<script>
let registering=false;
let me=null;
let selected=null;

async function api(url,options={}){
  const response=await fetch(url,{
    credentials:"same-origin",
    headers:{"Content-Type":"application/json"},
    ...options
  });
  const data=await response.json();
  if(!response.ok) throw Error(data.error||"Đã xảy ra lỗi");
  return data;
}

function switchMode(){
  registering=!registering;
  document.getElementById("heading").textContent=
    registering?"Đăng ký tài khoản":"Đăng nhập";
  document.getElementById("submitBtn").textContent=
    registering?"Đăng ký":"Đăng nhập";
  document.getElementById("authStatus").textContent="";
}

document.getElementById("authForm").onsubmit=async e=>{
  e.preventDefault();
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;
  try{
    const data=await api(registering?"/api/register":"/api/login",{
      method:"POST",
      body:JSON.stringify({username,password})
    });
    me=data.user;
    await enterApp();
  }catch(err){
    document.getElementById("authStatus").textContent=err.message;
  }
};

async function enterApp(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("welcome").textContent="Xin chào, "+me.username;
  await loadFriends();
}

async function logout(){
  try{await api("/api/logout",{method:"POST"});}
  finally{location.reload();}
}

async function searchUser(){
  try{
    const name=document.getElementById("searchName").value.trim();
    const data=await api("/api/users/"+encodeURIComponent(name));
    const box=document.getElementById("searchResult");
    box.replaceChildren();
    const p=document.createElement("p");
    p.textContent="Tìm thấy: @"+data.user.username;
    box.appendChild(p);
    if(!data.friends){
      const button=document.createElement("button");
      button.textContent="Kết bạn";
      button.onclick=async()=>{
        try{
          await api("/api/friends/request",{
            method:"POST",
            body:JSON.stringify({userId:data.user.id})
          });
          alert("Đã gửi lời mời kết bạn.");
          await loadFriends();
        }catch(e){alert(e.message);}
      };
      box.appendChild(button);
    }
  }catch(e){alert(e.message);}
}

async function loadFriends(){
  try{
    const data=await api("/api/friends");
    const box=document.getElementById("friends");
    box.replaceChildren();
    data.friends.forEach(friend=>{
      const div=document.createElement("div");
      div.className="user";
      div.textContent="@"+friend.username;
      div.onclick=()=>openChat(friend);
      box.appendChild(div);
    });

    const incoming=document.getElementById("incoming");
    incoming.replaceChildren();
    data.incoming.forEach(request=>{
      const div=document.createElement("div");
      div.className="user";
      div.textContent="Lời mời từ @"+request.username+" ";
      const btn=document.createElement("button");
      btn.textContent="Chấp nhận";
      btn.onclick=async()=>{
        try{
          await api("/api/friends/accept/"+request.id,{method:"POST"});
          await loadFriends();
        }catch(e){alert(e.message);}
      };
      div.appendChild(btn);
      incoming.appendChild(div);
    });
  }catch(e){
    document.getElementById("status").textContent=e.message;
  }
}

async function openChat(friend){
  selected=friend;
  document.getElementById("chatTitle").textContent=
    "Đang nhắn tin với @"+friend.username;
  await loadMessages();
}

async function loadMessages(){
  if(!selected)return;
  try{
    const data=await api("/api/messages/"+selected.id);
    const box=document.getElementById("messages");
    box.replaceChildren();
    data.messages.forEach(m=>{
      const div=document.createElement("div");
      div.className="msg"+(m.fromId===me.id?" mine":"");
      div.textContent=(m.fromId===me.id?"Bạn":m.fromName)+": "+m.body;
      box.appendChild(div);
    });
    box.scrollTop=box.scrollHeight;
  }catch(e){
    document.getElementById("status").textContent=e.message;
  }
}

document.getElementById("sendForm").onsubmit=async e=>{
  e.preventDefault();
  if(!selected)return alert("Hãy chọn một người bạn trước.");
  const input=document.getElementById("message");
  const body=input.value.trim();
  if(!body)return;
  try{
    await api("/api/messages",{
      method:"POST",
      body:JSON.stringify({toId:selected.id,body})
    });
    input.value="";
    await loadMessages();
  }catch(e){alert(e.message);}
};

async function restoreLogin(){
  try{
    const data=await api("/api/me");
    me=data.user;
    await enterApp();
  }catch(e){
    // Chưa đăng nhập: hiển thị màn hình đăng nhập.
  }
}
restoreLogin();
</script>
</body>
</html>
