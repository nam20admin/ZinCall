<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZinCall - VIP Communication Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            300: '#FFE599',
                            400: '#F5C242',
                            500: '#D4AF37',
                            600: '#AA820A',
                        },
                        dark: {
                            950: '#06080C',
                            900: '#0B0F19',
                            800: '#141A28',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gold-gradient': 'linear-gradient(135deg, #FFE599 0%, #D4AF37 50%, #AA820A 100%)',
                        'gold-metallic': 'linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%)',
                    }
                }
            }
        }
    </script>

    <style>
        .text-gold-metallic {
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 30%, #B38728 60%, #FBF5B7 80%, #AA771C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-panel {
            background: rgba(20, 26, 40, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .border-gold-glow {
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.12);
        }
    </style>
</head>

<body class="h-full antialiased selection:bg-gold-500 selection:text-black overflow-hidden font-sans">

    <div id="app" class="h-full w-full flex flex-col bg-dark-950 relative">

        <!-- AUTH SCREEN -->
        <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-dark-950/95 backdrop-blur-2xl">
            <div class="glass-panel w-full max-w-md p-8 rounded-3xl border-gold-glow relative shadow-2xl">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-gold-600 to-amber-200 text-dark-950 font-extrabold text-2xl mb-3">Z</div>
                    <h1 class="text-3xl font-black text-gold-metallic">ZinCall GitHub</h1>
                    <p class="text-[11px] text-slate-400 mt-1 uppercase tracking-widest font-semibold">Luxury Executive Messenger</p>
                </div>

                <div class="flex bg-slate-900 p-1 rounded-xl mb-6 border border-white/5">
                    <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg text-dark-950 bg-gold-gradient">Đăng Nhập</button>
                    <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-bold text-slate-400 rounded-lg">Đăng Ký</button>
                </div>

                <form id="form-login" onsubmit="handleAuth(event, 'login')" class="space-y-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-300 mb-1 block">Số điện thoại</label>
                        <input type="tel" id="login-phone" required placeholder="09xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-4 text-xs text-slate-100 focus:outline-none focus:border-gold-500">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-300 mb-1 block">Mật khẩu</label>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-4 text-xs text-slate-100 focus:outline-none focus:border-gold-500">
                    </div>
                    <button type="submit" class="w-full py-3 bg-gold-gradient text-dark-950 font-extrabold text-xs uppercase rounded-xl hover:brightness-110">Đăng Nhập</button>
                </form>

                <form id="form-register" onsubmit="handleAuth(event, 'register')" class="space-y-4 hidden">
                    <div>
                        <label class="text-xs font-semibold text-slate-300 mb-1 block">Họ và Tên</label>
                        <input type="text" id="reg-name" required placeholder="Nguyễn Văn A" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-3.5 text-xs text-slate-100 focus:outline-none focus:border-gold-500">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-300 mb-1 block">Số điện thoại</label>
                        <input type="tel" id="reg-phone" required placeholder="09xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-3.5 text-xs text-slate-100 focus:outline-none focus:border-gold-500">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-300 mb-1 block">Mật khẩu</label>
                        <input type="password" id="reg-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-3.5 text-xs text-slate-100 focus:outline-none focus:border-gold-500">
                    </div>
                    <button type="submit" class="w-full py-3 bg-gold-gradient text-dark-950 font-extrabold text-xs uppercase rounded-xl hover:brightness-110">Tạo Tài Khoản</button>
                </form>

                <div class="mt-4 pt-3 border-t border-slate-800 text-center">
                    <button onclick="createSampleData()" class="text-xs text-gold-400 underline font-semibold">Tự động tạo 2 SĐT mẫu để test ngay</button>
                </div>
            </div>
        </div>

        <!-- MAIN WORKSPACE -->
        <div class="flex-1 flex overflow-hidden">
            <aside class="w-16 md:w-20 bg-dark-900 border-r border-slate-800 flex flex-col items-center py-5 justify-between shrink-0">
                <div class="w-10 h-10 rounded-2xl bg-gold-gradient flex items-center justify-center text-dark-950 font-black">Z</div>
                <button onclick="logout()" class="text-slate-500 hover:text-rose-400 p-2" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
            </aside>

            <section class="w-80 md:w-96 bg-dark-900 border-r border-slate-800 flex flex-col shrink-0">
                <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                    <div>
                        <h2 class="text-lg font-extrabold text-gold-metallic">Trò Chuyện</h2>
                        <span id="my-phone-badge" class="text-[10px] text-gold-400 font-mono"></span>
                    </div>
                    <button onclick="openAddFriendModal()" class="w-8 h-8 rounded-xl bg-slate-800 text-gold-400 flex items-center justify-center">
                        <i class="fa-solid fa-user-plus text-xs"></i>
                    </button>
                </div>
                <div id="chat-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            </section>

            <main class="flex-1 flex flex-col bg-slate-950 relative">
                <header id="chat-header" class="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-dark-900/60 hidden">
                    <h3 id="active-chat-name" class="font-bold text-slate-100 text-sm"></h3>
                </header>
                <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                    <div id="empty-state" class="h-full flex items-center justify-center text-slate-600 text-xs">Chọn bạn bè hoặc bấm nút (+) để thêm SĐT kết bạn</div>
                </div>
                <div id="chat-input-area" class="p-4 border-t border-slate-800 hidden">
                    <form onsubmit="handleSendMessage(event)" class="flex gap-2">
                        <input id="chat-input" type="text" placeholder="Nhập tin nhắn..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none">
                        <button type="submit" class="px-5 bg-gold-gradient text-dark-950 font-bold rounded-xl text-xs">Gửi</button>
                    </form>
                </div>
            </main>
        </div>

        <!-- ADD FRIEND MODAL -->
        <div id="add-friend-modal" class="fixed inset-0 z-50 hidden bg-dark-950/80 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass-panel w-full max-w-md p-6 rounded-3xl border-gold-glow space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-base font-bold text-gold-metallic">Thêm Bạn Mới Bằng SĐT</h3>
                    <button onclick="closeAddFriendModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="flex gap-2">
                    <input id="search-friend-input" type="tel" placeholder="Nhập SĐT..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none">
                    <button onclick="searchFriendByPhone()" class="px-4 bg-gold-gradient text-dark-950 font-bold text-xs rounded-xl">Tìm kiếm</button>
                </div>
                <div id="search-result" class="hidden p-3.5 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                    <div>
                        <p id="found-user-name" class="text-xs font-bold text-slate-100"></p>
                        <p id="found-user-phone" class="text-[10px] text-slate-400"></p>
                    </div>
                    <button id="btn-add-found-user" onclick="addFoundUserAsFriend()" class="px-3 py-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg text-xs font-bold">Kết Bạn</button>
                </div>
                <p id="search-empty-result" class="hidden text-center text-xs text-rose-400">Không tìm thấy SĐT này trên máy!</p>
            </div>
        </div>

    </div>

    <script>
        const DB_KEY = 'zincall_master_db_v3';
        const SESSION_KEY = 'zincall_active_session_v3';

        let db = { users: {}, chats: {} };
        let currentUser = null;
        let activeChatUser = null;
        let searchedUser = null;

        window.onload = () => {
            loadDB();
            checkSession();
        };

        function loadDB() {
            const raw = localStorage.getItem(DB_KEY);
            if (raw) {
                try { db = JSON.parse(raw); } catch(e) {}
            }
        }

        function saveDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function checkSession() {
            const phone = localStorage.getItem(SESSION_KEY);
            if (phone && db.users[phone]) {
                currentUser = db.users[phone];
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('my-phone-badge').innerText = "SĐT: " + currentUser.phone;
                renderChatList();
            }
        }

        function switchAuthTab(type) {
            document.getElementById('form-login').classList.toggle('hidden', type !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', type !== 'register');
        }

        function handleAuth(e, type) {
            e.preventDefault();
            loadDB();

            if (type === 'register') {
                const name = document.getElementById('reg-name').value.trim();
                const phone = document.getElementById('reg-phone').value.trim();
                const password = document.getElementById('reg-password').value;

                if (!phone) return alert('Vui lòng nhập SĐT');
                if (db.users[phone]) return alert('SĐT đã tồn tại!');

                db.users[phone] = { name, phone, password, friends: [] };
                saveDB();

                currentUser = db.users[phone];
                localStorage.setItem(SESSION_KEY, phone);
                location.reload();
            } else {
                const phone = document.getElementById('login-phone').value.trim();
                const password = document.getElementById('login-password').value;

                if (!db.users[phone] || db.users[phone].password !== password) {
                    return alert('Sai SĐT hoặc mật khẩu!');
                }

                currentUser = db.users[phone];
                localStorage.setItem(SESSION_KEY, phone);
                location.reload();
            }
        }

        function createSampleData() {
            loadDB();
            db.users['0911111111'] = { name: 'Đinh Nam', phone: '0911111111', password: '123', friends: ['0922222222'] };
            db.users['0922222222'] = { name: 'Hoàng Linh', phone: '0922222222', password: '123', friends: ['0911111111'] };
            saveDB();
            alert('Đã tạo thành công 2 SĐT mẫu:\n1) 0911111111 (Pass: 123)\n2) 0922222222 (Pass: 123)');
        }

        function logout() {
            localStorage.removeItem(SESSION_KEY);
            location.reload();
        }

        function openAddFriendModal() {
            document.getElementById('add-friend-modal').classList.remove('hidden');
            document.getElementById('search-result').classList.add('hidden');
            document.getElementById('search-empty-result').classList.add('hidden');
        }

        function closeAddFriendModal() {
            document.getElementById('add-friend-modal').classList.add('hidden');
        }

        function searchFriendByPhone() {
            loadDB();
            const phone = document.getElementById('search-friend-input').value.trim();
            if (!phone || phone === currentUser.phone) return;

            if (db.users[phone]) {
                searchedUser = db.users[phone];
                document.getElementById('found-user-name').innerText = searchedUser.name;
                document.getElementById('found-user-phone').innerText = "SĐT: " + searchedUser.phone;
                document.getElementById('search-result').classList.remove('hidden');
                document.getElementById('search-empty-result').classList.add('hidden');

                const btn = document.getElementById('btn-add-found-user');
                if (currentUser.friends && currentUser.friends.includes(phone)) {
                    btn.innerText = "Đã là bạn";
                    btn.disabled = true;
                } else {
                    btn.innerText = "Kết Bạn";
                    btn.disabled = false;
                }
            } else {
                document.getElementById('search-result').classList.add('hidden');
                document.getElementById('search-empty-result').classList.remove('hidden');
            }
        }

        function addFoundUserAsFriend() {
            if (!searchedUser) return;
            loadDB();

            if (!currentUser.friends) currentUser.friends = [];
            if (!currentUser.friends.includes(searchedUser.phone)) currentUser.friends.push(searchedUser.phone);

            let target = db.users[searchedUser.phone];
            if (!target.friends) target.friends = [];
            if (!target.friends.includes(currentUser.phone)) target.friends.push(currentUser.phone);

            db.users[currentUser.phone] = currentUser;
            db.users[searchedUser.phone] = target;
            saveDB();

            closeAddFriendModal();
            renderChatList();
            selectChat(target);
        }

        function renderChatList() {
            loadDB();
            currentUser = db.users[currentUser.phone];
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';

            if (!currentUser.friends || currentUser.friends.length === 0) {
                listEl.innerHTML = `<div class="p-4 text-center text-slate-500 text-xs">Chưa có bạn bè. Bấm (+) để thêm.</div>`;
                return;
            }

            currentUser.friends.forEach(fPhone => {
                const friend = db.users[fPhone];
                if (!friend) return;

                const item = document.createElement('div');
                item.className = "p-3 bg-slate-900 border border-slate-800 rounded-2xl cursor-pointer hover:border-gold-500/50 flex items-center justify-between";
                item.onclick = () => selectChat(friend);
                item.innerHTML = `
                    <div>
                        <h4 class="font-bold text-xs text-slate-100">${friend.name}</h4>
                        <p class="text-[10px] text-slate-400">SĐT: ${friend.phone}</p>
                    </div>
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                `;
                listEl.appendChild(item);
            });
        }

        function getChatKey(p1, p2) {
            return [p1, p2].sort().join('_');
        }

        function selectChat(friend) {
            activeChatUser = friend;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            document.getElementById('active-chat-name').innerText = friend.name + " (" + friend.phone + ")";
            renderMessages();
        }

        function renderMessages() {
            loadDB();
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            const key = getChatKey(currentUser.phone, activeChatUser.phone);
            const messages = db.chats[key] || [];

            if (messages.length === 0) {
                container.innerHTML = `<div class="h-full flex items-center justify-center text-slate-600 text-xs">Bắt đầu trò chuyện với ${activeChatUser.name}</div>`;
                return;
            }

            messages.forEach(msg => {
                const isMe = msg.sender === currentUser.phone;
                const div = document.createElement('div');
                div.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
                div.innerHTML = `
                    <div class="max-w-[70%] px-4 py-2.5 rounded-2xl text-xs ${isMe ? 'bg-gold-gradient text-dark-950 font-bold' : 'bg-slate-900 text-slate-100 border border-slate-800'}">
                        ${msg.text}
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            loadDB();
            const key = getChatKey(currentUser.phone, activeChatUser.phone);
            if (!db.chats[key]) db.chats[key] = [];

            db.chats[key].push({ sender: currentUser.phone, text, time: Date.now() });
            saveDB();

            input.value = '';
            renderMessages();
        }
    </script>
</body>
</html>
