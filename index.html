<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZinCall - VIP Communication Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Montserrat & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#FFF9E6',
                            300: '#FFE082',
                            400: '#FFD54F',
                            500: '#FFC107',
                            600: '#FFB300',
                            700: '#FFA000',
                            800: '#FF8F00',
                        },
                        dark: {
                            900: '#090B10',
                            800: '#121620',
                            700: '#1A202C',
                            600: '#2D3748',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Metallic Gold Gradients & Glassmorphic UI */
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF5C0 0%, #E6C665 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-gradient-bg {
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #AA7C11 100%);
        }
        .gold-btn-hover:hover {
            background: linear-gradient(135deg, #FFE89C 0%, #E2B739 50%, #C48E08 100%);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .glass-panel {
            background: rgba(18, 22, 32, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .glass-panel-light {
            background: rgba(30, 38, 54, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .gold-border-glow {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090B10;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FFD700;
        }
    </style>
</head>
<body class="bg-dark-900 text-slate-100 font-sans h-screen overflow-hidden antialiased select-none">

    <!-- APP CONTAINER -->
    <div id="app" class="h-full w-full relative flex items-center justify-center">

        <!-- ================= AUTH CONTAINER (ĐĂNG KÝ / ĐĂNG NHẬP) ================= -->
        <div id="authContainer" class="w-full max-w-md p-6 z-20">
            <div class="glass-panel p-8 rounded-2xl gold-border-glow text-center shadow-2xl relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-500/10 rounded-full blur-2xl pointer-events-none"></div>
                
                <!-- Logo -->
                <div class="mb-6 inline-flex flex-col items-center">
                    <div class="w-20 h-20 rounded-full gold-gradient-bg p-1 shadow-lg flex items-center justify-center mb-2">
                        <div class="w-full h-full bg-dark-900 rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-phone-volume text-3xl gold-gradient-text"></i>
                        </div>
                    </div>
                    <h1 class="text-3xl font-extrabold font-display tracking-wider gold-gradient-text">ZinCall</h1>
                    <span class="text-xs uppercase tracking-widest text-amber-300/80 font-semibold mt-1">VIP Communication</span>
                </div>

                <!-- Tabs -->
                <div class="flex bg-dark-800 p-1 rounded-xl mb-6 border border-amber-500/20">
                    <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg gold-gradient-bg text-dark-900 shadow">Đăng Nhập</button>
                    <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-amber-200 transition">Đăng Ký</button>
                </div>

                <!-- Form Login -->
                <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4 text-left">
                    <div>
                        <label class="block text-xs font-medium text-amber-200/80 uppercase mb-1">Số điện thoại</label>
                        <div class="relative">
                            <i class="fa-solid fa-phone absolute left-3 top-3 text-slate-500"></i>
                            <input type="tel" id="loginPhone" required placeholder="0912345678" class="w-full bg-dark-800 border border-amber-500/20 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-amber-400 text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-amber-200/80 uppercase mb-1">Mật khẩu</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500"></i>
                            <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-dark-800 border border-amber-500/20 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-amber-400 text-white">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl font-bold text-dark-900 gold-gradient-bg gold-btn-hover transition duration-200 mt-2 shadow-lg">
                        ĐĂNG NHẬP VIP
                    </button>
                </form>

                <!-- Form Register -->
                <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-4 text-left hidden">
                    <div>
                        <label class="block text-xs font-medium text-amber-200/80 uppercase mb-1">Họ và Tên</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3 top-3 text-slate-500"></i>
                            <input type="text" id="regName" required placeholder="Nguyễn Văn A" class="w-full bg-dark-800 border border-amber-500/20 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-amber-400 text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-amber-200/80 uppercase mb-1">Số điện thoại</label>
                        <div class="relative">
                            <i class="fa-solid fa-phone absolute left-3 top-3 text-slate-500"></i>
                            <input type="tel" id="regPhone" required placeholder="0912345678" class="w-full bg-dark-800 border border-amber-500/20 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-amber-400 text-white">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-amber-200/80 uppercase mb-1">Mật khẩu</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500"></i>
                            <input type="password" id="regPass" required placeholder="••••••••" class="w-full bg-dark-800 border border-amber-500/20 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-amber-400 text-white">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-xl font-bold text-dark-900 gold-gradient-bg gold-btn-hover transition duration-200 mt-2 shadow-lg">
                        TẠO TÀI KHOẢN VIP
                    </button>
                </form>

                <!-- Shortcut test account -->
                <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                    <span>Thử nghiệm nhanh:</span>
                    <button onclick="createTestAccounts()" class="text-amber-400 underline hover:text-amber-300">Tạo 2 tài khoản mẫu</button>
                </div>
            </div>
        </div>


        <!-- ================= MAIN DASHBOARD CONTAINER ================= -->
        <div id="mainContainer" class="w-full h-full flex hidden">
            
            <!-- LEFT NAVIGATION BAR -->
            <div class="w-20 bg-dark-800 border-r border-amber-500/20 flex flex-col items-center py-6 justify-between z-10">
                <div class="flex flex-col items-center space-y-8">
                    <!-- Brand Icon -->
                    <div class="w-12 h-12 rounded-2xl gold-gradient-bg p-0.5 shadow-lg flex items-center justify-center cursor-pointer">
                        <div class="w-full h-full bg-dark-900 rounded-2xl flex items-center justify-center">
                            <i class="fa-solid fa-phone-volume text-xl gold-gradient-text"></i>
                        </div>
                    </div>

                    <!-- Navigation Items -->
                    <div class="flex flex-col space-y-6">
                        <button onclick="switchTab('chats')" id="navChats" class="p-3 rounded-xl text-amber-400 bg-amber-500/10 border border-amber-500/30 transition">
                            <i class="fa-solid fa-comments text-xl"></i>
                        </button>
                        <button onclick="switchTab('contacts')" id="navContacts" class="p-3 rounded-xl text-slate-400 hover:text-amber-300 transition">
                            <i class="fa-solid fa-address-book text-xl"></i>
                        </button>
                        <button onclick="openAddFriendModal()" class="p-3 rounded-xl text-slate-400 hover:text-amber-300 transition">
                            <i class="fa-solid fa-user-plus text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- User Profile Avatar & Logout -->
                <div class="flex flex-col items-center space-y-4">
                    <div class="relative group cursor-pointer" onclick="openAvatarModal()">
                        <img id="myAvatar" src="" class="w-11 h-11 rounded-full object-cover border-2 border-amber-400 shadow-md">
                        <div class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                            <i class="fa-solid fa-camera text-xs text-amber-300"></i>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="text-slate-500 hover:text-red-400 transition p-2">
                        <i class="fa-solid fa-right-from-bracket text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- SIDEBAR: CHATS / CONTACTS -->
            <div class="w-80 bg-dark-800/60 border-r border-amber-500/10 flex flex-col h-full">
                <!-- Sidebar Header -->
                <div class="p-4 border-b border-amber-500/10 flex items-center justify-between">
                    <h2 id="sidebarTitle" class="font-bold font-display text-lg gold-gradient-text">Đoạn Chát</h2>
                    <span id="myPhoneBadge" class="text-xs bg-amber-500/10 border border-amber-500/30 text-amber-300 px-2 py-1 rounded-full"></span>
                </div>

                <!-- Search Bar -->
                <div class="p-3">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-sm"></i>
                        <input type="text" id="searchInput" oninput="renderSidebar()" placeholder="Tìm kiếm..." class="w-full bg-dark-900 border border-amber-500/20 rounded-xl py-2 pl-9 pr-3 text-xs focus:outline-none focus:border-amber-400 text-white">
                    </div>
                </div>

                <!-- Lists Container -->
                <div id="sidebarList" class="flex-1 overflow-y-auto divide-y divide-slate-800/40">
                    <!-- Dynamic rendering -->
                </div>
            </div>

            <!-- CHAT / MAIN DISPLAY AREA -->
            <div class="flex-1 flex flex-col h-full bg-dark-900 relative">
                
                <!-- Chat Active Header -->
                <div id="chatHeader" class="p-4 border-b border-amber-500/10 flex items-center justify-between glass-panel hidden z-10">
                    <div class="flex items-center space-y-0 space-x-3">
                        <img id="activeTargetAvatar" src="" class="w-10 h-10 rounded-full object-cover border border-amber-400">
                        <div>
                            <h3 id="activeTargetName" class="font-bold text-sm text-white"></h3>
                            <span id="activeTargetPhone" class="text-xs text-amber-300/70"></span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button onclick="startCall('voice')" class="p-2.5 rounded-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 transition">
                            <i class="fa-solid fa-phone"></i>
                        </button>
                        <button onclick="startCall('video')" class="p-2.5 rounded-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 transition">
                            <i class="fa-solid fa-video"></i>
                        </button>
                    </div>
                </div>

                <!-- Chat Messages Body -->
                <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
                    <!-- Empty state -->
                    <div id="emptyChatState" class="h-full flex flex-col items-center justify-center text-center text-slate-500">
                        <i class="fa-solid fa-comments text-5xl mb-4 text-slate-700"></i>
                        <p class="text-sm">Chọn một bạn bè hoặc tìm kiếm SĐT để bắt đầu nhắn tin & gọi điện VIP</p>
                    </div>
                </div>

                <!-- Chat Input Footer -->
                <div id="chatFooter" class="p-4 border-t border-amber-500/10 glass-panel hidden">
                    <form onsubmit="sendMessage(event)" class="flex items-center space-x-2">
                        <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." class="flex-1 bg-dark-800 border border-amber-500/20 rounded-xl py-2.5 px-4 text-sm focus:outline-none focus:border-amber-400 text-white">
                        <button type="submit" class="px-5 py-2.5 rounded-xl font-bold text-dark-900 gold-gradient-bg gold-btn-hover transition">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ================= MODAL: KẾT BẠN ================= -->
        <div id="addFriendModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
            <div class="glass-panel p-6 rounded-2xl w-full max-w-sm gold-border-glow space-y-4">
                <div class="flex justify-between items-center border-b border-amber-500/20 pb-3">
                    <h3 class="font-bold gold-gradient-text">Kết Bạn Mới</h3>
                    <button onclick="closeAddFriendModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div>
                    <label class="block text-xs text-amber-200/80 mb-1">Nhập SĐT bạn bè</label>
                    <input type="tel" id="friendSearchPhone" placeholder="09xxxxxxxx" class="w-full bg-dark-800 border border-amber-500/20 rounded-xl py-2 px-3 text-sm focus:outline-none focus:border-amber-400 text-white">
                </div>
                <button onclick="searchAndAddFriend()" class="w-full py-2.5 rounded-xl font-bold text-dark-900 gold-gradient-bg">Tìm & Kết Bạn</button>
            </div>
        </div>

        <!-- ================= MODAL: ĐỔI AVATAR ================= -->
        <div id="avatarModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
            <div class="glass-panel p-6 rounded-2xl w-full max-w-sm gold-border-glow space-y-4 text-center">
                <h3 class="font-bold gold-gradient-text border-b border-amber-500/20 pb-3">Đổi Ảnh Đại Diện VIP</h3>
                <div class="flex justify-center">
                    <img id="avatarPreview" src="" class="w-24 h-24 rounded-full object-cover border-2 border-amber-400">
                </div>
                <input type="file" id="avatarFileInput" accept="image/*" onchange="previewAvatar(event)" class="text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500/10 file:text-amber-300 hover:file:bg-amber-500/20">
                <div class="flex space-x-2">
                    <button onclick="saveAvatar()" class="flex-1 py-2 rounded-xl font-bold text-dark-900 gold-gradient-bg">Lưu Ảnh</button>
                    <button onclick="closeAvatarModal()" class="flex-1 py-2 rounded-xl border border-slate-700 text-slate-300">Hủy</button>
                </div>
            </div>
        </div>

        <!-- ================= CALL OVERLAY SCREEN (VOICE & VIDEO) ================= -->
        <div id="callOverlay" class="fixed inset-0 bg-dark-900/95 backdrop-blur-md flex flex-col justify-between p-8 z-50 hidden">
            <!-- Call Top -->
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
                    <span id="callStatusText" class="text-xs tracking-wider uppercase text-amber-300 font-semibold">Đang gọi...</span>
                </div>
                <span id="callTimer" class="font-mono text-sm text-slate-400">00:00</span>
            </div>

            <!-- Call Center Visual -->
            <div class="flex-1 flex flex-col items-center justify-center relative my-4">
                <!-- Video Remote Stream -->
                <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover rounded-2xl border border-amber-500/30 hidden max-h-[60vh]"></video>
                
                <!-- Video Local Stream (PIP) -->
                <video id="localVideo" autoplay playsinline muted class="absolute bottom-4 right-4 w-32 h-44 object-cover rounded-xl border-2 border-amber-400 shadow-xl hidden"></video>

                <!-- Avatar Voice Fallback -->
                <div id="voiceAvatarContainer" class="flex flex-col items-center space-y-4">
                    <div class="relative">
                        <div class="w-32 h-32 rounded-full gold-gradient-bg p-1 animate-pulse">
                            <img id="callTargetAvatar" src="" class="w-full h-full rounded-full object-cover">
                        </div>
                    </div>
                    <h2 id="callTargetName" class="text-2xl font-bold text-white"></h2>
                    <p id="callTargetPhone" class="text-sm text-amber-300/80"></p>
                </div>
            </div>

            <!-- Call Controls -->
            <div class="flex items-center justify-center space-x-6">
                <button onclick="toggleMic()" id="btnToggleMic" class="w-12 h-12 rounded-full bg-dark-800 border border-amber-500/30 text-white flex items-center justify-center hover:bg-slate-700">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button onclick="endCall()" class="w-16 h-16 rounded-full bg-red-600 text-white flex items-center justify-center text-xl shadow-lg hover:bg-red-700 transition">
                    <i class="fa-solid fa-phone-slash"></i>
                </button>
                <button onclick="toggleCam()" id="btnToggleCam" class="w-12 h-12 rounded-full bg-dark-800 border border-amber-500/30 text-white flex items-center justify-center hover:bg-slate-700">
                    <i class="fa-solid fa-video"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Storage Keys
        const USERS_KEY = 'zincall_users_v2';
        const SESSION_KEY = 'zincall_current_user';
        const MESSAGES_KEY = 'zincall_messages_v2';

        // App State
        let currentUser = null;
        let activeTab = 'chats'; // 'chats' | 'contacts'
        let activeTargetPhone = null;
        let selectedAvatarData = null;
        let mediaStream = null;
        let callTimerInterval = null;
        let callSeconds = 0;

        // Default Avatars
        const DEFAULT_AVATAR = 'https://api.dicebear.com/7.x/bottts/svg?seed=VIPUser';

        // --- INIT & PERSISTENCE ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedSession = localStorage.getItem(SESSION_KEY);
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
                showMainApp();
            }
        });

        function getUsers() {
            return JSON.parse(localStorage.getItem(USERS_KEY) || '{}');
        }

        function saveUsers(users) {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function formatPhone(phone) {
            return phone.trim().replace(/\s+/g, '');
        }

        // --- AUTH LOGIC ---
        function switchAuthTab(tab) {
            const btnLogin = document.getElementById('tabLogin');
            const btnReg = document.getElementById('tabRegister');
            const formLogin = document.getElementById('formLogin');
            const formReg = document.getElementById('formRegister');

            if (tab === 'login') {
                btnLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg gold-gradient-bg text-dark-900 shadow";
                btnReg.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-amber-200 transition";
                formLogin.classList.remove('hidden');
                formReg.classList.add('hidden');
            } else {
                btnReg.className = "flex-1 py-2 text-sm font-semibold rounded-lg gold-gradient-bg text-dark-900 shadow";
                btnLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-amber-200 transition";
                formReg.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const phone = formatPhone(document.getElementById('regPhone').value);
            const pass = document.getElementById('regPass').value;

            if (!phone || phone.length < 9) {
                alert('Vui lòng nhập số điện thoại hợp lệ!');
                return;
            }

            const users = getUsers();
            if (users[phone]) {
                alert('Số điện thoại này đã được đăng ký trên hệ thống!');
                return;
            }

            const newUser = {
                name,
                phone,
                pass,
                avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${phone}`,
                friends: []
            };

            users[phone] = newUser;
            saveUsers(users);

            currentUser = newUser;
            localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
            showMainApp();
        }

        function handleLogin(e) {
            e.preventDefault();
            const phone = formatPhone(document.getElementById('loginPhone').value);
            const pass = document.getElementById('loginPass').value;

            const users = getUsers();
            const user = users[phone];

            if (!user) {
                alert('Số điện thoại này chưa được đăng ký!');
                return;
            }

            if (user.pass !== pass) {
                alert('Mật khẩu không chính xác!');
                return;
            }

            currentUser = user;
            localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
            showMainApp();
        }

        function handleLogout() {
            localStorage.removeItem(SESSION_KEY);
            currentUser = null;
            document.getElementById('mainContainer').classList.add('hidden');
            document.getElementById('authContainer').classList.remove('hidden');
        }

        function createTestAccounts() {
            const users = getUsers();
            users['0911111111'] = {
                name: 'Đinh Nam (VIP)',
                phone: '0911111111',
                pass: '123456',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=NamVIP',
                friends: ['0922222222']
            };
            users['0922222222'] = {
                name: 'Hoàng Linh',
                phone: '0922222222',
                pass: '123456',
                avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Linh',
                friends: ['0911111111']
            };
            saveUsers(users);
            alert('Đã tạo 2 tài khoản mẫu:\n1) 0911111111 (Pass: 123456)\n2) 0922222222 (Pass: 123456)');
        }

        // --- MAIN APP DISPLAY ---
        function showMainApp() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('mainContainer').classList.remove('hidden');

            document.getElementById('myAvatar').src = currentUser.avatar || DEFAULT_AVATAR;
            document.getElementById('myPhoneBadge').innerText = currentUser.phone;

            renderSidebar();
        }

        // --- TAB SWITCHING & SIDEBAR ---
        function switchTab(tab) {
            activeTab = tab;
            const navChats = document.getElementById('navChats');
            const navContacts = document.getElementById('navContacts');
            const sidebarTitle = document.getElementById('sidebarTitle');

            if (tab === 'chats') {
                navChats.className = "p-3 rounded-xl text-amber-400 bg-amber-500/10 border border-amber-500/30 transition";
                navContacts.className = "p-3 rounded-xl text-slate-400 hover:text-amber-300 transition";
                sidebarTitle.innerText = "Đoạn Chát";
            } else {
                navContacts.className = "p-3 rounded-xl text-amber-400 bg-amber-500/10 border border-amber-500/30 transition";
                navChats.className = "p-3 rounded-xl text-slate-400 hover:text-amber-300 transition";
                sidebarTitle.innerText = "Danh Bạ VIP";
            }
            renderSidebar();
        }

        function renderSidebar() {
            const listEl = document.getElementById('sidebarList');
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const users = getUsers();

            // Refresh current user data
            currentUser = users[currentUser.phone] || currentUser;

            listEl.innerHTML = '';

            if (activeTab === 'chats' || activeTab === 'contacts') {
                const friendsList = currentUser.friends || [];

                if (friendsList.length === 0) {
                    listEl.innerHTML = `
                        <div class="p-6 text-center text-slate-500 text-xs">
                            Chưa có bạn bè nào.<br>Bấm nút <i class="fa-solid fa-user-plus text-amber-400"></i> để thêm bạn bằng SĐT.
                        </div>
                    `;
                    return;
                }

                friendsList.forEach(fPhone => {
                    const friend = users[fPhone];
                    if (!friend) return;

                    if (filter && !friend.name.toLowerCase().includes(filter) && !friend.phone.includes(filter)) {
                        return;
                    }

                    const isSelected = activeTargetPhone === friend.phone;
                    const item = document.createElement('div');
                    item.className = `p-3.5 flex items-center space-x-3 cursor-pointer hover:bg-amber-500/5 transition ${isSelected ? 'bg-amber-500/10 border-l-2 border-amber-400' : ''}`;
                    item.onclick = () => selectChatTarget(friend.phone);

                    item.innerHTML = `
                        <img src="${friend.avatar || DEFAULT_AVATAR}" class="w-11 h-11 rounded-full object-cover border border-amber-500/30">
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline">
                                <h4 class="text-sm font-semibold text-white truncate">${friend.name}</h4>
                                <span class="text-[10px] text-amber-300/60">${friend.phone}</span>
                            </div>
                            <p class="text-xs text-slate-400 truncate">Sẵn sàng trò chuyện...</p>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }
        }

        // --- FRIEND LOGIC ---
        function openAddFriendModal() {
            document.getElementById('addFriendModal').classList.remove('hidden');
        }

        function closeAddFriendModal() {
            document.getElementById('addFriendModal').classList.add('hidden');
        }

        function searchAndAddFriend() {
            const searchPhone = formatPhone(document.getElementById('friendSearchPhone').value);
            if (!searchPhone) return;

            if (searchPhone === currentUser.phone) {
                alert('Không thể tự kết bạn với chính mình!');
                return;
            }

            const users = getUsers();
            const targetUser = users[searchPhone];

            if (!targetUser) {
                alert(`Không tìm thấy tài khoản nào sở hữu SĐT: ${searchPhone}`);
                return;
            }

            if (!currentUser.friends) currentUser.friends = [];
            if (currentUser.friends.includes(searchPhone)) {
                alert('Hai người đã là bạn bè rồi!');
                return;
            }

            // Mutual friendship
            currentUser.friends.push(searchPhone);
            if (!targetUser.friends) targetUser.friends = [];
            if (!targetUser.friends.includes(currentUser.phone)) {
                targetUser.friends.push(currentUser.phone);
            }

            users[currentUser.phone] = currentUser;
            users[searchPhone] = targetUser;
            saveUsers(users);

            alert(`Đã kết bạn thành công với ${targetUser.name}!`);
            closeAddFriendModal();
            renderSidebar();
            selectChatTarget(searchPhone);
        }

        // --- CHAT MESSAGING LOGIC ---
        function selectChatTarget(phone) {
            activeTargetPhone = phone;
            const users = getUsers();
            const target = users[phone];

            document.getElementById('emptyChatState').classList.add('hidden');
            document.getElementById('chatHeader').classList.remove('hidden');
            document.getElementById('chatFooter').classList.remove('hidden');

            document.getElementById('activeTargetAvatar').src = target.avatar || DEFAULT_AVATAR;
            document.getElementById('activeTargetName').innerText = target.name;
            document.getElementById('activeTargetPhone').innerText = target.phone;

            renderSidebar();
            renderMessages();
        }

        function getConversationKey(phone1, phone2) {
            return [phone1, phone2].sort().join('_');
        }

        function renderMessages() {
            if (!activeTargetPhone) return;
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            const key = getConversationKey(currentUser.phone, activeTargetPhone);
            const allMessages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '{}');
            const messages = allMessages[key] || [];

            messages.forEach(msg => {
                const isMe = msg.sender === currentUser.phone;
                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isMe ? 'justify-end' : 'justify-start'}`;

                wrapper.innerHTML = `
                    <div class="max-w-xs md:max-w-md px-4 py-2.5 rounded-2xl text-sm ${isMe ? 'gold-gradient-bg text-dark-900 font-medium rounded-tr-none shadow-md' : 'glass-panel text-white rounded-tl-none border border-amber-500/20'}">
                        <p>${msg.text}</p>
                        <span class="text-[9px] opacity-60 block text-right mt-1">${msg.time}</span>
                    </div>
                `;
                container.appendChild(wrapper);
            });

            container.scrollTop = container.scrollHeight;
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeTargetPhone) return;

            const key = getConversationKey(currentUser.phone, activeTargetPhone);
            const allMessages = JSON.parse(localStorage.getItem(MESSAGES_KEY) || '{}');
            if (!allMessages[key]) allMessages[key] = [];

            const now = new Date();
            const timeStr = `${now.getHours()}:${now.getMinutes() < 10 ? '0' : ''}${now.getMinutes()}`;

            allMessages[key].push({
                sender: currentUser.phone,
                text,
                time: timeStr
            });

            localStorage.setItem(MESSAGES_KEY, JSON.stringify(allMessages));
            input.value = '';
            renderMessages();
        }

        // --- AVATAR UPLOAD LOGIC ---
        function openAvatarModal() {
            document.getElementById('avatarPreview').src = currentUser.avatar || DEFAULT_AVATAR;
            document.getElementById('avatarModal').classList.remove('hidden');
        }

        function closeAvatarModal() {
            document.getElementById('avatarModal').classList.add('hidden');
        }

        function previewAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedAvatarData = event.target.result;
                    document.getElementById('avatarPreview').src = selectedAvatarData;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveAvatar() {
            if (selectedAvatarData) {
                currentUser.avatar = selectedAvatarData;
                const users = getUsers();
                users[currentUser.phone] = currentUser;
                saveUsers(users);
                localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));

                document.getElementById('myAvatar').src = currentUser.avatar;
                if (activeTargetPhone) renderMessages();
                renderSidebar();
            }
            closeAvatarModal();
        }

        // --- WEBRTC / CAMERA & VOICE CALL LOGIC ---
        async function startCall(type) {
            if (!activeTargetPhone) return;
            const users = getUsers();
            const target = users[activeTargetPhone];

            document.getElementById('callOverlay').classList.remove('hidden');
            document.getElementById('callTargetAvatar').src = target.avatar || DEFAULT_AVATAR;
            document.getElementById('callTargetName').innerText = target.name;
            document.getElementById('callTargetPhone').innerText = target.phone;

            const remoteVid = document.getElementById('remoteVideo');
            const localVid = document.getElementById('localVideo');
            const voiceAvt = document.getElementById('voiceAvatarContainer');

            callSeconds = 0;
            document.getElementById('callTimer').innerText = '00:00';
            callTimerInterval = setInterval(() => {
                callSeconds++;
                const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
                const s = (callSeconds % 60).toString().padStart(2, '0');
                document.getElementById('callTimer').innerText = `${m}:${s}`;
            }, 1000);

            try {
                const constraints = {
                    audio: true,
                    video: type === 'video'
                };
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

                if (type === 'video') {
                    voiceAvt.classList.add('hidden');
                    remoteVid.classList.remove('hidden');
                    localVid.classList.remove('hidden');
                    
                    localVid.srcObject = mediaStream;
                    remoteVid.srcObject = mediaStream; // Simulating remote view
                    document.getElementById('callStatusText').innerText = "ĐANG GỌI VIDEO HD...";
                } else {
                    voiceAvt.classList.remove('hidden');
                    remoteVid.classList.add('hidden');
                    localVid.classList.add('hidden');
                    document.getElementById('callStatusText').innerText = "ĐANG GỌI THOẠI VIP...";
                }
            } catch (err) {
                console.warn('Microphone/Camera access rejected or unavailable:', err);
                document.getElementById('callStatusText').innerText = "CUỘC GỌI GIẢ LẬP (KHÔNG CÓ MIC/CAM)";
            }
        }

        function endCall() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            if (callTimerInterval) clearInterval(callTimerInterval);

            document.getElementById('callOverlay').classList.add('hidden');
        }

        function toggleMic() {
            if (mediaStream) {
                const audioTrack = mediaStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    document.getElementById('btnToggleMic').classList.toggle('text-red-400');
                }
            }
        }

        function toggleCam() {
            if (mediaStream) {
                const videoTrack = mediaStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    document.getElementById('btnToggleCam').classList.toggle('text-red-400');
                }
            }
        }
    </script>
</body>
</html>
